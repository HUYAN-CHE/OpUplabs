<body>
    <div class="container">

        <div class="main">

                    <a href="#" class="contact-cta" id="contactCta">

                <div class="contact-pills">
                    <a href="https://x.com/OpUpLabs" target="_blank" class="contact-pill">
                        <i class="fab fa-x-twitter"></i>

                    </a>
                    <span class="contact-pill contact-pill-wechat">
                        <i class="fab fa-weixin"></i>
                        <span>UpLabs 向上求索</span>
                        <span class="pill-divider">|</span>

                    </span>
                    <a href="https://t.me/JemYano_o" target="_blank" class="contact-pill">

                        <span>Telegram</span>

            <footer class="site-footer">

    </div>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <script src="js/i18n.js"></script>
    <script src="js/drawer.js"></script>
    <script>
        const contactI18n = {
            zh: {
                topBarLeft: 'UpLabs · 联系',
                contactLabel: '取得联系',
                contactTitle: '让我们一起做点什么。',
                contactDesc: '无论是合作、咨询，还是只是想打个招呼。',
                contactCtaText: '打个招呼',
                contactWechatName: '搜索框: UpLabs 向上求索',
                wechatTooltip: '搜索：向上求索 UpLabs',
                footerRight: '持续实验'
            },
            en: {
                topBarLeft: 'UpLabs · Contact',
                contactLabel: 'Get in Touch',
                contactTitle: "Let's start something together.",
                contactDesc: 'For collaborations, inquiries, or just to say hello.',
                contactCtaText: 'Say Hello',
                contactWechatName: '搜索框: UpLabs 向上求索',
                wechatTooltip: 'Search: 向上求索 UpLabs',
                footerRight: 'Continuous Experiment'
            }
        };

        function typeWriter(el, text, speed = 70) {
            const textSpan = el.querySelector('.typewriter-text');
            const cursor = el.querySelector('.typewriter-cursor');
            if (!textSpan) return;
            textSpan.textContent = '';
            if (cursor) cursor.style.display = 'inline';
            let i = 0;
            function type() {
                if (i < text.length) {
                    textSpan.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (cursor) {
                    setTimeout(() => { cursor.style.display = 'none'; }, 1800);
                }
            }
            type();
        }

        function applyContactI18n() {
            const ids = ['contactLabel','contactDesc','contactCtaText','contactWechatName','wechatTooltip','footerRight'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = contactI18n[lang][id];
            });
            const titleEl = document.getElementById('contactTitle');
            if (titleEl) typeWriter(titleEl, contactI18n[lang].contactTitle);
        }

        setLang = function(l) {
            lang = l;
            localStorage.setItem('uplabs_lang', l);
            document.querySelectorAll('.lang-option').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === l);
            });
            applyI18n();
            const topBarLeft = document.getElementById('topBarLeft');
            if (topBarLeft) topBarLeft.textContent = contactI18n[lang].topBarLeft;
            applyContactI18n();
        };

        document.getElementById('scrollTop')?.addEventListener('click', scrollToTop);
        document.querySelectorAll('.lang-option').forEach(btn => {
            btn.addEventListener('click', () => setLang(btn.dataset.lang));
        });

        document.getElementById('contactCta')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'mailto:hujian1653266185@gmail.com';
        });

        setLang(lang);

        // Cursor glow
        const contactPage = document.getElementById('contactPage');
        const cursorGlow = document.querySelector('.cursor-glow');
        if (contactPage && cursorGlow) {
            contactPage.addEventListener('mousemove', (e) => {
                const rect = contactPage.getBoundingClientRect();
                cursorGlow.style.left = (e.clientX - rect.left) + 'px';
                cursorGlow.style.top = (e.clientY - rect.top) + 'px';
            });
        }
    </script>
</body>
</html>
